<!DOCTYPE html>
<html>
<head>
  <title>Add a New Recipe</title>
</head>
<body>

  <header>
    <h1>Add Your Favorite Recipe</h1>
    <nav>
      <a href="index.html"> Go BackHome</a> |
      <a href="add-recipe.html">Add Recipe</a> |
      <a href="recipe-list.html">Recipe List</a>
    </nav>
  </header>

  <form>
    <label>Recipe Name:</label><br>
    <input type="text" required><br><br>

    <label>Ingredients:</label><br>
    <textarea required></textarea><br><br>

    <label>Cooking Instructions:</label><br>
    <textarea required></textarea><br><br>

    <label>Image URL:</label><br>
    <input type="url"><br><br>

    <label>Category:</label><br>
    <select required>
      <option value="">--Select Category--</option>
      <option>Desserts</option>
      <option>Appetizers</option>
      <option>Main Course</option>
    </select><br><br>

    <button type="submit">Add Recipe</button>
  </form>


</body>
</html>
