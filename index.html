<!DOCTYPE html>
<html>
<head>
  <title>My Recipe Book</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: black;
      padding: 20px 0;
      text-align: center;
      color: white;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: white;
      margin: 0 25px;
      font-size: 20px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: brown;
    }

    section {
      padding: 40px;
      text-align: center;
    }

    section h2 {
      font-size: 28px;
      color: #333;
    }

    section h3 {
      font-size: 24px;
      color: #444;
    }

    img {
      margin-top: 20px;
      border-radius: 10px;
      max-width: 100%;
      height: auto;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      display: inline-block;
      margin: 0 20px;
    }

    ul li a {
      text-decoration: none;
      color: #ff7f50;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    ul li a:hover {
      color: #333;
    }

    footer {
      background-color: black;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 50px;
    }

  </style>
</head>
